[package]
name = "up-codecs"
version = "0.1.0"
edition = "2021"
publish = false
description = "Underpressured PNG codecs (oxipng + quantizr) behind a small C API"
license = "MIT"

[lib]
name = "up_codecs"
crate-type = ["staticlib", "rlib"]

[dependencies]
oxipng = { version = "=10.2.1", default-features = false }
quantizr = "=1.4.3"
png = "=0.18.1"

[build-dependencies]
cbindgen = { version = "=0.29.4", default-features = false }

[profile.release]
opt-level = 3
panic = "abort"
lto = false
codegen-units = 1
